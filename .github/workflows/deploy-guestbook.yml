name: Deploy Guestbook Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/guestbook/**"
      - ".github/workflows/deploy-guestbook.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply schema and deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/guestbook
          preCommands: wrangler d1 migrations apply n-library-guestbook --remote
          command: deploy
